plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'checkstyle'
    id 'com.github.spotbugs' version '6.5.9'
}

group = 'com'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '13.9.0'
    configFile = file('../config/checkstyle/checkstyle.xml')
    configDirectory = file('../config/checkstyle')
}

spotbugs {
    toolVersion = '4.10.3'
    excludeFilter = file('../config/spotbugs/exclude-filter.xml')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc:4.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc:4.1.0'
    implementation 'org.mybatis:mybatis:3.5.16'
    implementation 'org.mybatis:mybatis-spring:3.0.4'
    implementation 'org.mybatis.generator:mybatis-generator-core:1.4.2'
    runtimeOnly 'com.h2database:h2'

    annotationProcessor 'org.projectlombok:lombok'
    compileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = false
    }
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('check') {
    dependsOn tasks.named('spotbugsMain')
    dependsOn tasks.named('spotbugsTest')
}

tasks.register('generateMyBatisArtifacts', JavaExec) {
    group = 'build'
    description = 'Generate MyBatis model/mapper artifacts from generatorConfig.xml'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.mybatis.generator.api.ShellRunner'
    args = ['-configfile', 'src/main/resources/generator/generatorConfig.xml', '-overwrite']

    doFirst {
        def dbDir = file('build/generated-db')
        dbDir.mkdirs()
        def dbFile = new File(dbDir, 'mybatis-generator.mv.db')
        if (!dbFile.exists()) {
            def process = ['java', '-cp', sourceSets.main.runtimeClasspath.asPath, 'org.h2.tools.RunScript', '-url', 'jdbc:h2:file:./build/generated-db/mybatis-generator;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE', '-user', 'sa', '-password', '', '-script', 'src/main/resources/generator/init-schema.sql'].execute()
            process.waitForProcessOutput(System.out, System.err)
            if (process.exitValue() != 0) {
                throw new GradleException('Failed to initialize H2 schema for MyBatis generator')
            }
        }
    }
}
